name: Build Tauri App

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            artifact-name: linux
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact-name: windows
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            artifact-name: macos-arm

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build CLI sidecar binary (Unix)
        if: matrix.platform != 'windows-latest'
        run: cargo build --release --target ${{ matrix.rust-target }}

      - name: Build CLI sidecar binary (Windows)
        if: matrix.platform == 'windows-latest'
        run: cargo build --release --target ${{ matrix.rust-target }} --no-default-features

      - name: Copy CLI binary to Tauri sidecar location (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          mkdir -p ui/src-tauri/binaries
          cp target/${{ matrix.rust-target }}/release/skiver \
             ui/src-tauri/binaries/skiver-${{ matrix.rust-target }}

      - name: Copy CLI binary to Tauri sidecar location (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "ui\src-tauri\binaries" | Out-Null
          Copy-Item "target\${{ matrix.rust-target }}\release\skiver.exe" `
                    "ui\src-tauri\binaries\skiver-${{ matrix.rust-target }}.exe"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui
          tauriScript: npm run tauri
          # Publish to a GitHub Release when a version tag is pushed
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Skiver ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          releaseDraft: true
          prerelease: false

      - name: Upload build artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: skiver-${{ matrix.artifact-name }}
          if-no-files-found: ignore
          path: |
            ui/src-tauri/target/release/bundle/deb/*.deb
            ui/src-tauri/target/release/bundle/appimage/*.AppImage
            ui/src-tauri/target/release/bundle/msi/*.msi
            ui/src-tauri/target/release/bundle/nsis/*.exe
            ui/src-tauri/target/release/bundle/dmg/*.dmg
            ui/src-tauri/target/release/bundle/macos/*.app.tar.gz
