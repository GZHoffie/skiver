[package]
name = "skiver"
version = "0.3.1"
edition = "2024"
license = "MIT"

[features]
default = ["bam"]
bam = ["dep:rust-htslib", "dep:hts-sys"]

[dependencies]
needletail = "0.5.0"
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }
simple_logger=  { version = "3", features = ["stderr"] }
glob = "0.3.2"
clap = { version = "3", features = ["derive"] }
bincode = "1"
serde = { version = "1", features = ["derive"] }
crossbeam-channel = "0.5.15"
rand = "0.9.2"
csv = "1"
kuva = { version = "0.4", features = ["pdf"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
rust-htslib = { version = "0.45", default-features = false, features = ["bzip2", "lzma"], optional = true }
hts-sys = { version = "=2.1.1", default-features = false, optional = true }
